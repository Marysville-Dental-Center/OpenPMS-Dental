<!doctype html>
<!-- The link preview card: site/social-card.png (1200x630, the site's og:image) and branding/social-preview.png (1280x640, uploaded by
     hand in the repository's Settings > Social preview). Regenerate both with branding/Render-SocialCard.ps1 after changing this file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open PMS - Dental card</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; }
body {
  background: linear-gradient(135deg, #17223A 0%, #22345A 55%, #2E4675 100%);
  color: #FFFFFF;
  font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
  display: flex; align-items: center; overflow: hidden;
}
.card { display: flex; align-items: center; gap: 56px; padding: 0 72px; }
.logo { width: 240px; height: 240px; flex: none; border-radius: 53px; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45), 0 0 0 2px rgba(255, 255, 255, 0.18); }
.text { min-width: 0; }
.name { font-size: 76px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.05; margin: 0 0 18px; }
.tag { font-size: 36px; font-weight: 400; line-height: 1.3; margin: 0 0 34px; color: #DCE5F5; max-width: 19em; }
.facts { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; list-style: none; }
.facts li { font-size: 22px; font-weight: 600; padding: 7px 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.28); }
</style>
</head>
<body>
<div class="card">
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Open PMS - Dental logo">
    <rect width="100" height="100" rx="22" fill="#3C5A96"/>
    <path transform="translate(9,8) scale(0.82)" fill="#FFFFFF" d="M22 30 C22 14 38 12 50 20 C62 12 78 14 78 30 C78 44 74 52 72 62 C70 74 68 88 61 88 C55 88 55 72 50 66 C45 72 45 88 39 88 C32 88 30 74 28 62 C26 52 22 44 22 30 Z"/>
  </svg>
  <div class="text">
    <p class="name">Open PMS - Dental</p>
    <p class="tag">Free, open-source dental practice management software</p>
    <ul class="facts"><li>GPL</li><li>Windows 11</li><li>.NET 10, 64-bit</li><li>Nothing phones home</li></ul>
  </div>
</div>
</body>
</html>
