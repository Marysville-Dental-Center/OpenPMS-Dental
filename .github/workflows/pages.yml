# The project site on GitHub Pages: site/ with the logo, a sitemap and robots.txt, deployed on every push to main that changes them.
# The site's address comes from GitHub at deploy time and replaces __BASE_URL__ in index.html, so no file the site is built from names it.
name: Project site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "branding/logo.svg"
      - "branding/logo-256.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            site
            branding
          submodules: false
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Search engine ownership checks: set the repository variables GOOGLE_SITE_VERIFICATION (the content value of the
      # google-site-verification tag Search Console gives) and BING_SITE_VERIFICATION (msvalidate.01) to add the tags.
      - name: Assemble the site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL"
          mkdir -p _site
          cp -r site/. _site/
          cp branding/logo.svg _site/logo.svg
          cp branding/logo-256.png _site/logo-256.png
          today=$(date -u +%Y-%m-%d)
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>%s/</loc><lastmod>%s</lastmod></url>\n</urlset>\n' "$BASE_URL" "$today" > _site/sitemap.xml
          printf 'User-agent: *\nAllow: /\nSitemap: %s/sitemap.xml\n' "$BASE_URL" > _site/robots.txt
          verify=""
          if [ -n "$GOOGLE_SITE_VERIFICATION" ]; then verify="$verify<meta name=\"google-site-verification\" content=\"$GOOGLE_SITE_VERIFICATION\">"; fi
          if [ -n "$BING_SITE_VERIFICATION" ]; then verify="$verify<meta name=\"msvalidate.01\" content=\"$BING_SITE_VERIFICATION\">"; fi
          sed -i -e "s#__BASE_URL__#$BASE_URL#g" -e "s#<!-- site-verification -->#$verify#" _site/index.html
          if grep -q "__BASE_URL__" _site/index.html; then echo "A __BASE_URL__ placeholder was left in index.html"; exit 1; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
